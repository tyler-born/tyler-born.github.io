:root{--bg:#e9edf1;--ink:#101b27;--mut:#51606e;--acc:#1b4bd1;--rule:#c3ccd5;--card:#f7f9fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Archivo,system-ui,sans-serif}
a{color:var(--acc)}a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header,main,footer{max-width:1120px;margin:0 auto;padding:0 24px}
header{padding-top:72px;padding-bottom:48px;border-bottom:2px solid var(--ink)}
h1{font-size:clamp(3rem,10vw,6.5rem);line-height:.95;margin:0 0 20px;font-stretch:125%;font-weight:800;letter-spacing:-.02em}
header p{max-width:36em;font-size:1.2rem;margin:0 0 20px}
nav{display:flex;gap:24px;flex-wrap:wrap;font-weight:600}
.p{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:40px;padding:48px 0;border-bottom:1px solid var(--rule)}
.t{align-self:start;position:sticky;top:24px}
h2{font-size:1.5rem;line-height:1.15;margin:0 0 12px;font-weight:700}
.t p{margin:0 0 12px;color:var(--mut)}
.g{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
figure{margin:0;max-width:100%}
figure img{display:block;max-width:100%;max-height:440px;width:auto;height:auto}
img.w{mix-blend-mode:multiply}
figcaption{width:0;min-width:100%;padding-top:8px;font-size:.9rem;color:var(--mut)}
.v{position:relative;padding-top:56.25%;width:100%}
.v iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
footer{padding-top:40px;padding-bottom:64px;color:var(--mut)}

<h1>Tyler Born</h1>
<p>Mechanical engineering student at Oregon State University. I design, simulate, and build hardware.</p>

<script>
var P=[
{h:"HALE: Avionics Bay",t:["I am a member of the High Altitude Liquid Engine (HALE) rocketry club at Oregon State, which is building a 20 ft rocket.","I designed the main avionics bay, which holds most of the rocket’s avionics."],i:[["hale-av-photo","The bay with its avionics mounted."],["hale-av-cad","CAD model of the bay."]]},
{h:"HALE: Carbon Fiber Tube Cutting Jig",t:["A jig built from a repurposed 3D printer frame for cutting carbon fiber tube.","Rollers that rotate lock one axis of rotation depending on the operation, and a roller on the Z-axis bar clamps and rotates the tube. A mounting arm holds a Dremel that cuts radially or travels along the tube’s length, so the jig makes slots as well as full circumferential cuts.","Rotating the rollers and the Dremel arm by 90° gives the second configuration."],i:[["jig-cad","CAD model in the first configuration."],["jig-cad-2","The same jig with the rollers and Dremel arm rotated 90°."]]},
{h:"HALE: Nosecone CFD-to-FEA Verification",t:["I ran a supersonic CFD simulation in ANSYS Fluent to get the pressure load on the nosecone, then applied that load in a static structural FEA of a 3D printed section. The material properties were deliberately conservative, so a pass here should hold up in flight.","Peak von Mises stress was about 1.2 MPa, and the tip deflected about 0.1 mm at most. The factor of safety stayed above 15 everywhere on the part."],i:[["nose-pressure","Static pressure from the Fluent run, in Pa."],["nose-stress","Von Mises stress on a half model. The maximum is about 24,650 psf (1.2 MPa)."],["nose-deform","Total deformation. The maximum is 0.0003155 ft (about 0.1 mm)."]]},
{h:"HALE: Canard Moment Analysis",t:["For a research active control project, I ran supersonic CFD on a canard at its maximum deflection and top speed to find the largest aerodynamic moment on it.","The maximum moment about the servo axis was 0.054 N·m at 5° deflection and Mach 1.1. The canard has a 50 mm base chord."],i:[["canard-contour","Surface contour around the canard cutout."],["canard-streamlines","Streamlines over the canard, colored by velocity."]]},
{h:"5-Arm Linkage Robotic Pen Plotter",t:["A robotic pen plotter built around a 5-arm linkage, with two stepper motors driving the arms and a servo lifting the pen.","I draw in Inkscape and export the SVG as G-code. A Python parser reads the G-code and uses gradient descent to convert each Cartesian point into the two motor angles, minimizing the difference between the target position and the position the linkage reaches.","A linkage like this can reach the same point with more than one set of angles. The first guess is the middle of the drawing area, which finds the correct solution, and every later guess starts from the previous result, so the solver lands on the nearest solution, which is the correct one. The parser also subdivides long moves, so the pen travels in straight lines even though the kinematics are non-linear.","Belt tension is built into the design, and a 3:1 pulley ratio increases the torque at the arms."],v:"oGrvPE2qcAo",i:[["plotter-photo","The plotter drawing a design."],["plotter-cad","CAD model of the linkage."]]},
{h:"PCB CNC Machine",t:["A CNC machine built on an Ender 3 frame for isolation routing copper-clad PCBs and cutting acrylic and other plastics.","It runs a custom Marlin configuration with contact-based Z probing and bilinear bed leveling. I tuned spindle speed and feed rate for clean isolation cuts, and rewired the Z endstop so it levels automatically on conductive material. The flex shaft spindle sits on a PETG-CF printed bracket and runs through a 1500 W inline AC speed controller."],i:[["cnc-milling","Milling acrylic."],["cnc-board","An early board milled on the machine, the first version of the smart plug controller PCB."],["cnc-overall","The full machine."]]},
{h:"Smart Plug Controller",t:["A battery-powered wall button that toggles smart plugs. It runs on an ESP32-C3 with four mechanical switches. The board stays in deep sleep and wakes only on a button press to send an HTTP request to the target plug, so a charge lasts weeks.","I milled the PCB on the machine above, and the back panel is machined acrylic cut on the same machine."],i:[["plug-front","Front of the final version, with the ESP32-C3 visible through a small acrylic window."],["plug-back","Back of the final version, showing the milled PCB behind the acrylic panel."]]},
{h:"Competition Model Rocket",t:["A model rocket for a team competition, designed for apogee accuracy, flight stability, and recovery success. Our team won.","It flew on a D12-5 engine, with a 3D printed nosecone and fins and an Estes parachute recovery system. The custom payload carries an IMU that measures acceleration, angular velocity, orientation, and temperature, in a PETG-CF housing.","I did most of the 3D design, soldered the payload electronics, and printed most of the parts."],i:[["rocket","The finished rocket."],["rocket-cad","Section view of the CAD model."],["rocket-payload","The IMU payload in its housing."],["rocket-launch","Launch."]]},
{h:"3D Printed Mechanical Clock",t:["A weight-driven mechanical clock with a Graham escapement. I calculated the gear ratios and escapement dynamics by hand, and it keeps time to within ±3 minutes per day.","The structure is 3D printed, and the hardware is bearings, screws, and nuts."],i:[["clock-photo","The running clock."],["clock-cad","CAD model."]]},
{h:"Competition Drone with Electromagnet Claw",t:["A drone for a high school competition, with a servo-actuated claw. The three claw arms retract back and up to expose an electromagnet at the drone’s center, so one vehicle can grip a payload mechanically or lift ferrous payloads magnetically.","I designed all of it myself."],i:[["drone-cad","CAD model of the drone."],["drone-claw","The printed claw assembly."]]},
{h:"Fold N Hold",t:["A fly fishing product I designed that holds a fully rigged rod folded to half length for transport. It is 3D printed in carbon fiber reinforced PETG, fits 3 to 7 weight rods, and comes with interchangeable tips in three sizes.","It sells profitably, and I have filed a provisional patent application. 25% of profits go to fly-fishing nonprofits and fisheries.","<a href=\"https://foldnholdflyfishing.com/\">foldnholdflyfishing.com</a>"],i:[["fnh-photo","Fold N Hold on a rigged rod."],["fnh-cad","CAD model."]]},
{h:"Ergo Split Keyboard",t:["I was commissioned in high school to design an ergonomic split keyboard with wrist rests and a numpad in the middle. The left half, numpad, and right half connect through magnetic snap wire connections, so each section can be repositioned on its own."],i:[["ergo-cad","CAD render."]]}
];

h+='</div></section>'});
m.innerHTML=h;
