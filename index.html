<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tyler Born | Engineering Portfolio</title>
<meta name="description" content="Mechanical engineering projects by Tyler Born: rocketry, CFD and FEA, robotics, and 3D printed mechanisms.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf1;--ink:#101b27;--mut:#51606e;--acc:#1b4bd1;--rule:#c3ccd5;--card:#f7f9fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Archivo,system-ui,sans-serif}
a{color:var(--acc)}a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header,main,footer{max-width:1120px;margin:0 auto;padding:0 24px}
header{padding-top:72px;padding-bottom:48px;border-bottom:2px solid var(--ink)}
h1{font-size:clamp(3rem,10vw,6.5rem);line-height:.95;margin:0 0 20px;font-stretch:125%;font-weight:800;letter-spacing:-.02em}
header p{max-width:36em;font-size:1.2rem;margin:0 0 20px}
nav{display:flex;gap:24px;flex-wrap:wrap;font-weight:600}
.p{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:40px;padding:48px 0;border-bottom:1px solid var(--rule)}
.t{align-self:start;position:sticky;top:24px}
h2{font-size:1.5rem;line-height:1.15;margin:0 0 12px;font-weight:700}
.t p{margin:0 0 12px;color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
figure{margin:0;background:var(--card);border:1px solid var(--rule)}
figure img{display:block;width:100%;height:340px;object-fit:contain;background:#fff}
figcaption{padding:10px 12px;font-size:.9rem;color:var(--mut)}
.v{position:relative;padding-top:56.25%;grid-column:1/-1}
.v iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
footer{padding-top:40px;padding-bottom:64px;color:var(--mut)}
@media(max-width:760px){.p{grid-template-columns:1fr;gap:20px}.t{position:static}}
</style>
</head>
<body>
<header>
<h1>Tyler Born</h1>
<p>Mechanical engineering student at Oregon State University. I design, simulate, and build hardware, from rocket components to desktop machines.</p>
<nav><a href="https://linkedin.com/in/tylerborn">LinkedIn</a><a id="em" href="#">Email</a></nav>
</header>
<main id="main"></main>
<footer>Tyler Born, Oregon State University, B.S. Mechanical Engineering, expected 2029.</footer>
<script>
var P=[
{h:"HALE: Avionics Bay",t:["Member of the High Altitude Liquid Engine (HALE) rocketry club at Oregon State, working on the club’s 20 ft rocket.","I designed the main avionics bay, the section that houses most of the rocket’s avionics."],i:[["hale-av-photo","The bay with its avionics mounted."],["hale-av-cad","CAD model of the bay."]]},
{h:"HALE: Carbon Fiber Tube Cutting Jig",t:["A jig built from a repurposed 3D printer frame for cutting carbon fiber tube.","Rollers rotate to lock one axis based on the operation, and a roller on the Z-axis bar clamps and rotates the tube. A mounting arm holds a Dremel that cuts radially or travels along the tube, so the jig makes slots as well as full circumferential cuts."],i:[["jig-cad","CAD model of the jig."]]},
{h:"HALE: Nosecone CFD-to-FEA Verification",t:["I ran supersonic CFD in ANSYS Fluent to get the pressure load on the nosecone, then applied it in a static structural FEA of a 3D printed section. I used deliberately conservative material properties so a pass would hold up in flight.","Peak von Mises stress was about 1.2 MPa and maximum deflection about 0.1 mm at the tip. The factor of safety stayed above 15 across the whole part."],i:[["nose-pressure","Static pressure from the Fluent run, in Pa."],["nose-stress","Von Mises stress on a half model. The maximum is about 24,650 psf (1.2 MPa)."],["nose-deform","Total deformation. The maximum is 0.0003155 ft (about 0.1 mm)."]]},
{h:"HALE: Canard Moment Analysis",t:["For a research active control project, I ran supersonic CFD on a canard at its maximum deflection angle and top speed to find the largest aerodynamic moment on it.","The maximum moment about the servo axis was 0.054 N·m at 5° deflection and Mach 1.1, on a canard with a 50 mm base chord."],i:[["canard-contour","Surface contour around the canard cutout."],["canard-streamlines","Streamlines over the canard, colored by velocity."]]},
{h:"5-Arm Linkage Robotic Pen Plotter",t:["A custom 5-arm linkage plotter with dual stepper motors and a servo-actuated end effector.","I wrote a Python parsing engine that uses inverse kinematics and gradient descent to map Cartesian coordinates into the plotter’s joint space, so standard vector paths can be drawn without a commercial motion controller."],v:"oGrvPE2qcAo",i:[["plotter-photo","The plotter drawing a design."],["plotter-cad","CAD model of the linkage."]]},
{h:"PCB CNC Machine",t:["A CNC machine built on an Ender 3 frame for isolation routing copper-clad PCBs and cutting acrylic and other plastics.","It runs a custom Marlin configuration with contact-based Z probing and bilinear bed leveling. I tuned spindle speed and feed rate for clean isolation cuts and rewired the Z endstop to level automatically on conductive material. The flex shaft spindle sits on a PETG-CF printed bracket and is driven by a 1500 W inline AC speed controller."],i:[["cnc-milling","Milling acrylic."],["cnc-board","An early board milled on the machine, the first version of the smart plug controller PCB."],["cnc-overall","The full machine."]]},
{h:"Smart Plug Controller",t:["A battery-powered wall button that toggles smart plugs. It uses an ESP32-C3 with four mechanical switches and sleeps in deep sleep, waking only on a button press to send an HTTP request to the target plug. Battery life stretches to weeks between charges.","The PCB was milled on the machine above, and the back panel is machined acrylic cut on the same machine."],i:[["plug-front","Front of the final version, with the ESP32-C3 visible through a small acrylic window."],["plug-back","Back of the final version, showing the milled PCB behind the acrylic panel."]]},
{h:"Competition Model Rocket",t:["A high-performance model rocket for a competitive team project, designed around apogee accuracy, flight stability, and recovery success. The team won the competition.","It uses a D12-5 engine, 3D printed PLA fins and nosecone, and an Estes parachute recovery system. The custom payload has an IMU measuring acceleration, angular velocity, orientation, and temperature, in a PETG-CF housing.","I did all of the 3D design, soldered the payload electronics, and printed most of the parts."],i:[["rocket","The finished rocket."],["rocket-cad","Section view of the CAD model."],["rocket-payload","The IMU payload in its housing."],["rocket-launch","Launch."]]},
{h:"3D Printed Mechanical Clock",t:["A weight-driven mechanical clock using a Graham escapement. I calculated the gear ratios and escapement dynamics from scratch, and the finished clock holds within ±3 minutes per day.","The structure is 3D printed, with bearings, screws, and nuts as the hardware."],i:[["clock-photo","The running clock."],["clock-cad","CAD model."]]},
{h:"Competition Drone with Electromagnet Claw",t:["A drone for a high school competition with a servo-actuated claw. The three claw arms retract back and up to expose an electromagnet at the drone’s center, so the same vehicle can grip mechanically or pick up ferrous payloads magnetically.","I did the full design independently."],i:[["drone-cad","CAD model of the drone."],["drone-claw","The printed claw assembly."]]},
{h:"Fold N Hold",t:["A fly fishing product I designed that holds a fully rigged rod folded to half length for transport. It is 3D printed in carbon fiber reinforced PETG, fits 3 to 7 weight rods, and ships with interchangeable tips in three sizes.","It sells profitably, a provisional patent application has been filed, and 25% of profits go to fly-fishing nonprofits and fisheries.","<a href=\"https://foldnholdflyfishing.com/\">foldnholdflyfishing.com</a>"],i:[["fnh-photo","Fold N Hold on a rigged rod."],["fnh-cad","CAD model."]]},
{h:"Ergo Split Keyboard",t:["Commissioned in high school: an ergonomic split keyboard with wrist rests and a numpad in the middle. The left half, numpad, and right half connect through magnetic snap wire connections, so each section can be repositioned independently."],i:[["ergo-cad","CAD render."]]}
];
var m=document.getElementById("main"),h="";
P.forEach(function(p){
h+='<section class="p"><div class="t"><h2>'+p.h+'</h2>'+p.t.map(function(x){return"<p>"+x+"</p>"}).join("")+'</div><div class="g">';
if(p.v)h+='<div class="v"><iframe src="https://www.youtube.com/embed/'+p.v+'" title="'+p.h+' video" loading="lazy" allowfullscreen></iframe></div>';
p.i.forEach(function(x){h+='<figure><img src="images/'+x[0]+'.jpg" alt="'+x[1]+'" loading="lazy"><figcaption>'+x[1]+'</figcaption></figure>'});
h+='</div></section>'});
m.innerHTML=h;
var u="tylerfborn",d="gmail.com";document.getElementById("em").href="mailto:"+u+"@"+d;
</script>
</body>
</html>
